const inviteBlock=()=>adminOn()?inviteCard():(isAdmin()?lockCard('Zum Einladen von Personen musst du dich anmelden.'):`<div class="card dim"><p class="muted">Nur der Admin lädt Personen ein.</p></div>`);
function boatEditForm(b){
  return `<div class="card dim"><label class="f"><span>Name</span><input type="text" data-bind="S.eb.name" value="${esc(S.eb.name)}" id="eb-name"></label><label class="f"><span>Typ</span><input type="text" data-bind="S.eb.type" value="${esc(S.eb.type)}"></label>
  <div class="acts"><button class="btn sm" type="button" data-act="pickphoto" data-id="ebphoto">${ico('cam',18)}Foto ändern</button><input class="sr-only" type="file" accept="image/*" id="ebphoto" data-file="ebphoto:${b.id}" aria-label="Bootsfoto wählen" tabindex="-1"></div>
  <div class="acts"><button class="btn primary sm" type="button" data-act="boatsave">Speichern</button><button class="btn sm" type="button" data-act="boatcancel">Abbrechen</button></div></div>`;
}
function boatAdminActs(b){
  if(!adminOn())return '';
  const cf=S.confirm&&S.confirm.kind==='boat'&&S.confirm.id===b.id;
  return (S.editBoat===b.id?boatEditForm(b):`<div class="acts"><button class="btn sm" type="button" data-act="boatedit" data-id="${b.id}">${ico('edit',18)}Bearbeiten</button><button class="btn danger sm" type="button" data-act="boatrm" data-id="${b.id}">${ico('trash',18)}Entfernen</button></div>`)+
  (cf?`<div class="confirm"><p>Boot „${esc(b.name)}“ wirklich entfernen?</p><button class="btn sm" type="button" data-act="boatno">Abbrechen</button><button class="btn danger sm" type="button" data-act="boatyes">Endgültig entfernen</button></div>`:'');
}
function addBoatCard(){
  if(!adminOn())return isAdmin()?lockCard('Zum Anlegen von Booten musst du dich anmelden.'):`<div class="card dim"><p class="muted">Nur der Admin legt Boote an.</p></div>`;
  return `<div class="card"><div class="legend">Boot anlegen</div>
  <div class="boatpic">${S.nb.photo?`<img src="${S.nb.photo}" alt="Vorschau Bootsfoto">`:boatSVG(nextCi()||4)}</div>
  <div class="acts"><button class="btn sm" type="button" data-act="pickphoto" data-id="nbphoto">${ico('cam',18)}Foto wählen</button><input class="sr-only" type="file" accept="image/*" id="nbphoto" data-file="nbphoto" aria-label="Bootsfoto wählen" tabindex="-1"></div>
  <div class="row2"><label class="f"><span>Name</span><input type="text" id="nb-name" data-bind="S.nb.name" value="${esc(S.nb.name)}" autocomplete="off"></label><label class="f"><span>Typ</span><input type="text" data-bind="S.nb.type" value="${esc(S.nb.type)}" placeholder="z. B. Dehler 34"></label></div>
  ${S.nbErr?`<div class="err">${S.nbErr}</div>`:''}
  <button class="btn primary block" type="button" data-act="boatadd">${ico('plus',20)}Boot hinzufügen</button></div>`;
}
function nextCi(){for(let i=1;i<=4;i++)if(!S.boats.some(b=>b.ci===i))return i;return 0;}
const newTripBtn=()=>`<button class="btn block" type="button" data-act="newtoern">Neuen Törn anlegen …</button>`;
function memberStatus(p){return p.status==='angenommen'?'<span class="st ok">angenommen</span>':'<span class="st warn">eingeladen</span>';}
function memberActs(p){
  if(!adminOn()||p.id===S.me)return '';
  const cf=S.confirm&&S.confirm.kind==='mem'&&S.confirm.id===p.id;
  return `<div class="mem-acts">${p.status==='eingeladen'?`<button class="btn sm" type="button" data-act="resend" data-id="${p.id}">${ico('mail',18)}Erneut senden</button><button class="btn sm" type="button" data-act="accept" data-id="${p.id}">${ico('check',18)}Annahme simulieren</button>`:''}<button class="btn danger sm" type="button" data-act="memrm" data-id="${p.id}">Entfernen</button></div>`+
  (cf?`<div class="confirm" style="margin-top:10px"><p>${esc(p.name)} wirklich aus dem Törn entfernen?</p><button class="btn sm" type="button" data-act="memno">Abbrechen</button><button class="btn danger sm" type="button" data-act="memyes">Endgültig entfernen</button></div>`:'');
}

/* ---------- Navigation / Render ---------- */
function focusKey(){const a=document.activeElement;if(!a||a===document.body||!a.closest('#view,#tb-extra'))return null;if(a.id)return '#'+a.id;if(a.dataset&&a.dataset.act)return `[data-act="${a.dataset.act}"]`+(a.dataset.id!==undefined?`[data-id="${a.dataset.id}"]`:'');return null;}
function render(){
  const fk=focusKey();
  $('#tb-sub').textContent=`${S.trip.name} · Tag ${S.today}`;
  const r=$('#tb-role');r.hidden=!isAdmin();
  $$('.tab').forEach(t=>{if(t.dataset.id===S.view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  $('#tb-extra').innerHTML=topExtra();
  $('#view').innerHTML=S.view==='heute'?viewHeute():S.view==='tag'?viewTag():S.view==='karte'?viewKarte():viewToern();
  if(fk){try{const el=$(fk);if(el)el.focus({preventScroll:true});}catch(_){}}
}
let toastT;
function toast(m,ms=3400){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
function themeIcon(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('#theme-btn').innerHTML=ico(dark?'sonne':'moon',22);}

/* ---------- Sheet ---------- */
function buildSheet(){
  $('#f-type').innerHTML=TYPES.map(([id,l])=>`<button class="chip" type="button" role="radio" data-act="shtype" data-id="${id}">${ico(id,18)}${l}</button>`).join('');
  $('#f-wx').innerHTML=WX.map(([id,l])=>`<button class="chip" type="button" data-act="shwx" data-id="${id}" aria-pressed="false">${ico(id,26)}${l}</button>`).join('');
  $('#f-bft').innerHTML=BFT.map((b,i)=>`<button type="button" data-act="shbft" data-id="${i}" style="--lv:${i/12}" aria-pressed="false" aria-label="${i} Beaufort, ${b[0]}">${i}</button>`).join('');
  const sv=$('#rose'),c=100,r0=30,r1=78,pt=(r,a)=>[c+r*Math.sin(a*Math.PI/180),c-r*Math.cos(a*Math.PI/180)].map(n=>n.toFixed(2));
  let h='';
  DIRS.forEach((d,i)=>{const a=i*22.5,[x0,y0]=pt(r1,a-11.25),[x1,y1]=pt(r1,a+11.25),[x2,y2]=pt(r0,a+11.25),[x3,y3]=pt(r0,a-11.25);
    h+=`<path class="w ${i%4==0?'card4':''}" role="radio" tabindex="0" aria-checked="false" aria-label="Wind aus ${d}" data-act="shdir" data-id="${i}" d="M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z"/>`;});
  DIRS.forEach((d,i)=>{if(i%2)return;const[tx,ty]=pt(90,i*22.5);h+=`<text x="${tx}" y="${ty}" ${i%4==0?'style="font-weight:700"':''}>${d}</text>`;});
  h+=`<text class="ctr" id="rose-ctr" x="100" y="100">–</text>`;
  sv.innerHTML=h;
}
function phonePos(){
  const bid=suggestBoat(),last=bid?dayEntries(S.today,[bid]).pop():null;
  const base=last||{lat:54.436,lon:10.19};
  return {lat:base.lat+0.004+S.fix*.0006,lon:base.lon+0.012+S.fix*.0009};
}
function syncSheet(){
  const sh=S.sh,d=sh.draft,ro=sh.ro;
  $$('#f-boat').forEach(el=>el.innerHTML=boatChipsHTML('shboat',d.boat||'__',false));
  $$('#f-type .chip').forEach(b=>b.setAttribute('aria-checked',b.dataset.id===d.type));
  $$('#rose .w').forEach(p=>p.setAttribute('aria-checked',+p.dataset.id===d.dir));
  $('#rose-ctr').textContent=d.dir==null?'–':DIRS[d.dir];
  $('#wd-out').textContent=d.dir==null?'keine Angabe':`aus ${DIRS[d.dir]} · ${Math.round(d.dir*22.5)}°`;
  $$('#f-bft button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.id===d.bft));
  $('#bft-desc').innerHTML=d.bft==null?'Nicht gesetzt':`<b>${d.bft} – ${BFT[d.bft][0]}</b><small>ca. ${BFT[d.bft][1]} kn</small>`;
  $$('#f-wx .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===d.wx));
  $('#boat-err').hidden=true;
  if(sh.mode==='new'){
    const sg=suggestBoat();
    $('#boat-hint').textContent=sg?`Vorausgewählt: ${boatById(sg).name} (${S.dev[S.me]?'zuletzt von dir gewählt':'für dich vorab zugewiesen'}). Die Wahl bleibt nur auf diesem Gerät gespeichert.`:'Noch kein Boot gewählt. Die Wahl bleibt nur auf diesem Gerät gespeichert.';
    $('#boat-hint').hidden=false;
  }else $('#boat-hint').hidden=true;
}
function showSheet(){
  const sh=S.sh,d=sh.draft,e=sh.mode==='edit'?S.entries.find(x=>x.id===sh.id):null;
  S.lastFocus=document.activeElement;
  const b=d.boat?boatById(d.boat):null;
  $('#sh-title').textContent=sh.mode==='new'?`Neuer Eintrag · ${d.t}`:(sh.suppl?'Eintrag ergänzen · ':sh.ro?'Eintrag ansehen · ':'Eintrag · ')+d.t;
  $('#sh-pos').textContent=`${fpos(d,3)} · ${sh.mode==='new'?'Handy-GPS ± 5 m':'± 6 m'}`;
  $('#f-text').value=d.text||'';
  const ro=$('#sh-ro');
  if(sh.ro){ro.hidden=false;ro.style.borderLeftColor=b?`var(--b${b.ci})`:'';ro.innerHTML=`<b>Nur ansehen</b>Eintrag von ${esc(pname(d.by))}${b?' · '+esc(b.name):''}. Fremde Einträge kannst du nicht ändern oder löschen.`;}
  else if(e&&e.by!==S.me){ro.hidden=false;ro.innerHTML=`<b>Admin-Bearbeitung</b>Eintrag von ${esc(pname(d.by))}${b?' · '+esc(b.name):''}. Als Admin darfst du ihn ändern oder löschen.`;}
  else ro.hidden=true;
  $('#sh-by').textContent=e?`Erfasst von ${pname(e.by)}${b?' · '+b.name:''}`:`Wird gespeichert als Eintrag von ${meP().name}.`;
  $('#sh-form').inert=sh.ro;$('#sh-form').style.opacity=sh.ro?.85:1;
  $('#del-confirm').hidden=true;$('#f-del').hidden=sh.ro||sh.mode==='new';$('#f-save').hidden=sh.ro;$('#f-close').hidden=!sh.ro;
  $('#f-save').textContent=sh.mode==='new'?'Eintrag speichern':'Speichern';
  syncSheet();
  const el=$('#sheet'),sc=$('#scrim');el.hidden=false;sc.hidden=false;$('#sh-body').scrollTop=0;
  requestAnimationFrame(()=>{el.classList.add('open');sc.classList.add('open');});
  $('#sh-close').focus();
  render();
}
function openSheet(id,suppl){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  S.sh={mode:'edit',id,suppl:!!suppl,ro:!canEdit(e),draft:{...e}};
  showSheet();
}
function openNewSheet(){
  const g=phonePos();
  S.sh={mode:'new',ro:false,draft:{boat:suggestBoat()||'',type:'eintrag',dir:null,bft:null,wx:null,text:'',lat:g.lat,lon:g.lon,t:nowT(),by:S.me}};
  showSheet();
}
function closeSheet(){
  const el=$('#sheet'),sc=$('#scrim');if(el.hidden)return;
  el.classList.remove('open');sc.classList.remove('open');
  setTimeout(()=>{if(!S.sh){el.hidden=true;sc.hidden=true;}},260);
  S.sh=null;render();
  const lf=S.lastFocus;if(lf&&document.contains(lf))lf.focus({preventScroll:true});
}
function saveSheet(){
  const sh=S.sh,d=sh.draft;d.text=$('#f-text').value;
  if(!d.boat){$('#boat-err').hidden=false;const c=$('#f-boat .chip');if(c)c.focus();$('#fs-boat').scrollIntoView({block:'center'});return;}
  const bn=boatById(d.boat).name;
  if(sh.mode==='new'){
    const e=ME(S.today,d.boat,d.t,d.lat,d.lon,d.type,d.dir,d.bft,d.wx,d.text,S.me);
    S.entries.push(e);S.dev[S.me]=d.boat;S.clock+=1;S.fix++;
    if(VARIANT==='switch'&&S.sel!=='all')S.sel=d.boat;
    closeSheet();toast(`Eintrag ${e.t} gespeichert · ${bn}`);
  }else{
    const e=S.entries.find(x=>x.id===sh.id),t=e.t;
    Object.assign(e,{boat:d.boat,type:d.type,dir:d.dir,bft:d.bft,wx:d.wx,text:d.text});
    closeSheet();toast(`Eintrag ${t} gespeichert`);
  }
}

/* Schnell-Eintrag */
let busy=false;
function doFix(){
  if(busy)return;busy=true;
  const b=$('#fix');if(b){b.classList.add('busy');$('#fix-ico').innerHTML=ico('motor',40);$('#fix-lbl').textContent='Position wird bestimmt …';$('#fix-sub').textContent='GPS-Fix, ± 5 m';}
  setTimeout(()=>{
    busy=false;
    if(VARIANT==='switch'&&S.sel!=='all'){
      const g=phonePos(),e=ME(S.today,S.sel,nowT(),g.lat,g.lon,'eintrag',null,null,null,'',S.me);
      S.entries.push(e);S.dev[S.me]=S.sel;S.clock+=1;S.fix++;
      toast(`Eintrag ${e.t} gespeichert · ${boatById(S.sel).name} · ${fpos(e)}`,3800);
      render();setTimeout(()=>{if(!S.sh)openSheet(e.id,true);},500);
    }else{render();openNewSheet();}
  },1100);
}

/* ---------- Aktionen ---------- */
function movePerson(pid,bid){
  const p=personById(pid);if(!p||!adminOn())return;
  p.pre=bid||null;S.moveSel=null;render();
  toast(`${p.name} → ${bid?boatById(bid).name:'kein Vorschlag'} (nur Vorschlag, keine Berechtigung)`,3800);
}
const ACT={
  go(el){S.view=el.dataset.id;S.confirm=null;S.moveSel=null;render();window.scrollTo(0,0);},
  open(el){openSheet(el.dataset.id,false);},
  fix(){doFix();},
  day(el){S.day=+el.dataset.id;S.repEdit=null;S.confirm=null;render();},
  mapday(el){S.mapDay=+el.dataset.id;render();},
  maptog(el){const i=el.dataset.id;S.mapOff[i]=!S.mapOff[i];render();},
  sel(el){S.sel=el.dataset.id;if(S.sel!=='all')S.dev[S.me]=S.sel;render();},
  filt(el){S.sel=el.dataset.id;render();},
  /* Sheet */
  shtype(el){if(S.sh&&!S.sh.ro){S.sh.draft.type=el.dataset.id;syncSheet();}},
  shdir(el){if(S.sh&&!S.sh.ro){const v=+el.dataset.id,d=S.sh.draft;d.dir=d.dir===v?null:v;syncSheet();}},
  shbft(el){if(S.sh&&!S.sh.ro){const v=+el.dataset.id,d=S.sh.draft;d.bft=d.bft===v?null:v;syncSheet();}},
  shwx(el){if(S.sh&&!S.sh.ro){const d=S.sh.draft;d.wx=d.wx===el.dataset.id?null:el.dataset.id;syncSheet();}},
  shboat(el){if(S.sh&&!S.sh.ro){S.sh.draft.boat=el.dataset.id;syncSheet();const c=$(`#f-boat [data-id="${el.dataset.id}"]`);if(c)c.focus();}},
  /* Tagesbericht */
  repnew(){S.repEdit={day:S.day,by:S.me};S.repDraft='';render();setTimeout(()=>{const t=$('#rep-text');if(t)t.focus();},0);},
  repedit(el){const r=S.reports.find(x=>x.day===S.day&&x.by===el.dataset.id);S.repEdit={day:S.day,by:el.dataset.id};S.repDraft=r?r.text:'';S.confirm=null;render();},
  repcancel(){S.repEdit=null;S.confirm=null;render();},
  repsave(){
    const ed=S.repEdit,txt=S.repDraft.trim();if(!ed)return;
    if(!txt){toast('Bitte einen kurzen Text eingeben');const t=$('#rep-text');if(t)t.focus();return;}
    let r=S.reports.find(x=>x.day===ed.day&&x.by===ed.by);
    if(r){r.text=txt;r.t=nowT();}else S.reports.push({day:ed.day,by:ed.by,t:nowT(),text:txt});
    S.clock+=1;S.repEdit=null;render();toast(ed.by===S.me?'Dein Abschnitt ist gespeichert':`Abschnitt von ${pname(ed.by)} gespeichert (Admin)`);
  },
  repdel(el){S.confirm={kind:'rep',id:el.dataset.id};render();},
  repno(){S.confirm=null;render();},
  repyes(){const ed=S.repEdit;S.reports=S.reports.filter(x=>!(x.day===ed.day&&x.by===ed.by));S.repEdit=null;S.confirm=null;render();toast('Abschnitt gelöscht');},
  /* Konto */
  login(){openLogin(()=>{render();if(!$('#onb').hidden)renderOnb();});},
  logout(){S.signedIn=false;S.me=S.people.find(p=>p.admin).id;S.confirm=null;S.editBoat=null;render();toast('Abgemeldet · Einträge schreiben geht weiter lokal, Admin-Funktionen ruhen');},
  as(el){S.me=el.dataset.id;S.repEdit=null;S.confirm=null;S.editBoat=null;S.moveSel=null;
    if(VARIANT==='switch')S.sel=suggestBoat()||'all';
    render();toast(`Prototyp zeigt jetzt die Sicht von ${meP().name}${meP().admin?' (Admin)':''}`);},
  /* Einladen */
  invboat(el){S.inv.boat=el.dataset.id;render();},
  invite(){
    const m=S.inv.email.trim();
    if(!validMail(m)){S.invErr='Bitte eine gültige E-Mail-Adresse eingeben.';render();const i=$('#inv-email');if(i)i.focus();return;}
    if(S.people.some(p=>p.email.toLowerCase()===m.toLowerCase())){S.invErr='Diese Adresse ist schon im Törn.';render();return;}
    const p={id:'p'+(pidn++),name:nameFromEmail(m),email:m,admin:false,status:'eingeladen',pre:S.inv.boat||null};
    S.people.push(p);S.inv={email:'',boat:''};S.invErr='';render();
    toast(`Einladung an ${m} gesendet${p.pre?' · Vorschlag: '+boatById(p.pre).name:''} (Prototyp)`,3800);
  },
  resend(el){toast(`Einladung an ${personById(el.dataset.id).email} erneut gesendet`);},
  accept(el){const p=personById(el.dataset.id);p.status='angenommen';render();toast(`${p.name} hat die Einladung angenommen (Demo)`);},
  memrm(el){S.confirm={kind:'mem',id:el.dataset.id};render();},
  memno(){S.confirm=null;render();},
  memyes(){const id=S.confirm.id,p=personById(id);S.people=S.people.filter(x=>x.id!==id);S.confirm=null;render();toast(`${p.name} entfernt`);},
  /* Boote */
  pickphoto(el){const i=document.getElementById(el.dataset.id);if(i)i.click();},
  boatadd(){
    const n=S.nb.name.trim();
    if(!n){S.nbErr='Bitte dem Boot einen Namen geben.';render();const i=$('#nb-name');if(i)i.focus();return;}
    const ci=nextCi();if(!ci){S.nbErr='Im Prototyp sind bis zu 4 Boote möglich.';render();return;}
    S.boats.push({id:'b'+(bseq++),name:n,type:S.nb.type.trim()||'Boot',ci,photo:S.nb.photo});
    S.nb={name:'',type:'',photo:null};S.nbErr='';render();toast(`Boot „${n}“ angelegt · eigene Farbe auf der Karte`);
  },
  boatedit(el){const b=boatById(el.dataset.id);S.editBoat=b.id;S.eb={name:b.name,type:b.type};S.confirm=null;render();},
  boatcancel(){S.editBoat=null;render();},
  boatsave(){const b=boatById(S.editBoat),n=S.eb.name.trim();if(!n){toast('Bitte einen Namen eingeben');return;}b.name=n;b.type=S.eb.type.trim()||b.type;S.editBoat=null;render();toast('Boot gespeichert');},
  boatrm(el){
    const b=boatById(el.dataset.id);
    if(S.boats.length<2){toast('Ein Törn braucht mindestens ein Boot');return;}
    if(S.entries.some(e=>e.boat===b.id)){toast(`„${b.name}“ hat Einträge und kann nicht entfernt werden`);return;}
    S.confirm={kind:'boat',id:b.id};render();
  },
  boatno(){S.confirm=null;render();},
  boatyes(){
    const id=S.confirm.id,b=boatById(id);S.boats=S.boats.filter(x=>x.id!==id);
    S.people.forEach(p=>{if(p.pre===id)p.pre=null;});Object.keys(S.dev).forEach(k=>{if(S.dev[k]===id)delete S.dev[k];});
    if(S.sel===id)S.sel=VARIANT==='switch'?(suggestBoat()||'all'):'all';
    S.confirm=null;render();toast(`Boot „${b.name}“ entfernt`);
  },
  /* Crew-Plan / Vorschlag */
  psel(el){if(!adminOn())return;S.moveSel=S.moveSel===el.dataset.id?null:el.dataset.id;render();},
  moveto(el){movePerson(S.moveSel,el.dataset.id);},
  /* Onboarding */
  newtoern(){openOnb();},
  onext(){onbNext();},
  oback(){O.step--;renderOnb();},
  oadd(){
    const n=O.nb.name.trim();
    if(!n){O.err='Bitte dem Boot einen Namen geben.';renderOnb();const i=$('#o-bname');if(i)i.focus();return;}
    if(O.boats.length>=4){O.err='Im Prototyp sind bis zu 4 Boote möglich.';renderOnb();return;}
    O.boats.push({name:n,type:O.nb.type.trim()||'Boot',photo:O.nb.photo});O.nb={name:'',type:'',photo:null};O.err='';renderOnb();const i=$('#o-bname');if(i)i.focus();
  },
  orm(el){O.boats.splice(+el.dataset.id,1);renderOnb();},
  oib(el){O.ib=el.dataset.id;renderOnb();},
  oinv(){
    const m=O.ie.trim();
    if(!validMail(m)){O.ierr='Bitte eine gültige E-Mail-Adresse eingeben.';renderOnb();const i=$('#o-ie');if(i)i.focus();return;}
    if(O.inv.some(x=>x.email.toLowerCase()===m.toLowerCase())){O.ierr='Diese Adresse steht schon in der Liste.';renderOnb();return;}
    O.inv.push({email:m,boat:O.ib});O.ie='';O.ierr='';renderOnb();const i=$('#o-ie');if(i)i.focus();
  },
  oirm(el){O.inv.splice(+el.dataset.id,1);renderOnb();},
  /* Login */
  lsend(){
    const m=L.email.trim();
    if(!validMail(m)){L.err='Bitte eine gültige E-Mail-Adresse eingeben.';renderLogin();return;}
    L.email=m;L.err='';L.step=2;renderLogin();
  },
  lback(){L.step=1;L.err='';L.code='';renderLogin();},
  lverify(){
    if(!/^[A-Za-z0-9]{6,8}$/.test(L.code.trim())){L.err='Bitte den Code aus der E-Mail eingeben.';renderLogin();return;}
    S.signedIn=true;S.email=L.email;const cb=L.cb;closeLogin();
    toast(`Angemeldet als ${L.email} · Admin-Funktionen freigeschaltet`,3800);
    if(cb)cb();else render();
  }
};
let bseq=3;
document.addEventListener('click',ev=>{
  const t=ev.target.closest&&ev.target.closest('[data-act]');if(!t)return;
  const fn=ACT[t.dataset.act];if(fn)fn(t,ev);
});
function setPath(path,v){const root={S,O,L};const parts=path.split('.');let o=root[parts[0]];for(let i=1;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=v;}
document.addEventListener('input',ev=>{const b=ev.target.dataset&&ev.target.dataset.bind;if(b)setPath(b,ev.target.value);});
function readFile(file,cb){const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsDataURL(file);}
document.addEventListener('change',ev=>{
  const t=ev.target,c=t.dataset&&t.dataset.chg;
  if(c==='pre'){movePerson(t.dataset.id,t.value);}
  const fl=t.dataset&&t.dataset.file;
  if(fl&&t.files&&t.files[0]){
    readFile(t.files[0],data=>{
      if(fl==='nbphoto'){S.nb.photo=data;render();}
      else if(fl==='obphoto'){O.nb.photo=data;renderOnb();}
      else if(fl.startsWith('ebphoto:')){boatById(fl.slice(8)).photo=data;render();toast('Bootsfoto übernommen');}
    });
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(!$('#login').hidden)closeLogin();else if(!$('#onb').hidden)closeOnb();else if(!$('#sheet').hidden)closeSheet();}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.rose .w,.mk')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('#login input')){ev.preventDefault();const b=$('#login-body .primary');if(b)b.click();}
});
/* Drag & Drop (Crew-Plan) */
document.addEventListener('dragstart',ev=>{const r=ev.target.closest&&ev.target.closest('.prow[draggable="true"]');if(!r)return;ev.dataTransfer.setData('text/plain',r.dataset.pid);ev.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',ev=>{const g=ev.target.closest&&ev.target.closest('.pgroup');if(g&&adminOn()){ev.preventDefault();$$('.pgroup.drop').forEach(x=>{if(x!==g)x.classList.remove('drop');});g.classList.add('drop');}});
document.addEventListener('drop',ev=>{const g=ev.target.closest&&ev.target.closest('.pgroup');if(!g||!adminOn())return;ev.preventDefault();movePerson(ev.dataTransfer.getData('text/plain'),g.dataset.bid);});
document.addEventListener('dragend',()=>$$('.pgroup.drop').forEach(x=>x.classList.remove('drop')));

$('#sh-close').onclick=closeSheet;$('#f-close').onclick=closeSheet;$('#scrim').onclick=closeSheet;
const stepDir=k=>{if(!S.sh||S.sh.ro)return;const d=S.sh.draft;d.dir=d.dir==null?(k>0?0:15):(d.dir+k+16)%16;syncSheet();};
$('#wd-prev').onclick=()=>stepDir(-1);$('#wd-next').onclick=()=>stepDir(1);
$('#f-save').onclick=saveSheet;
$('#f-del').onclick=()=>{$('#del-confirm').hidden=false;$('#f-del').hidden=true;$('#f-save').hidden=true;$('#del-no').focus();};
$('#del-no').onclick=()=>{$('#del-confirm').hidden=true;$('#f-del').hidden=false;$('#f-save').hidden=false;$('#f-del').focus();};
$('#del-yes').onclick=()=>{const e=S.entries.find(x=>x.id===S.sh.id),t=e.t;S.entries.splice(S.entries.indexOf(e),1);closeSheet();toast(`Eintrag ${t} gelöscht`);};
$('#theme-btn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';themeIcon();};

/* ---------- Login ---------- */
let L={step:1,email:'',code:'',err:'',cb:null};
function openLogin(cb){L={step:1,email:S.email||'',code:'',err:'',cb};renderLogin();$('#login').hidden=false;}
function closeLogin(){$('#login').hidden=true;}
function renderLogin(){
  $('#login-body').innerHTML=L.step===1
   ?`<p class="muted">Für Admin-Funktionen (Boote anlegen, Personen einladen) brauchst du ein Cloud-Konto. Wir schicken dir einen Code per E-Mail, kein Passwort.</p>
     <label class="f"><span>E-Mail-Adresse</span><input type="email" id="l-email" inputmode="email" autocomplete="email" data-bind="L.email" value="${esc(L.email)}" placeholder="name@example.com"></label>
     ${L.err?`<div class="err">${L.err}</div>`:''}
     <button class="btn primary block" type="button" data-act="lsend">${ico('mail',20)}Code senden</button>
     <p class="muted small">Ohne Anmeldung bleibt alles lokal auf diesem Gerät nutzbar.</p>`
   :`<p class="muted">Wir haben einen Code an <b>${esc(L.email)}</b> geschickt.</p>
     <label class="f"><span>Code</span><input type="text" id="l-code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="one-time-code" maxlength="8" data-bind="L.code" value="${esc(L.code)}" placeholder="AB12CD" class="mono"></label>
     ${L.err?`<div class="err">${L.err}</div>`:''}
     <button class="btn primary block" type="button" data-act="lverify">Anmelden</button>
     <button class="btn block" type="button" data-act="lback">Andere E-Mail-Adresse</button>
     <p class="muted small">Prototyp: Jeder Code mit 6–8 Buchstaben/Ziffern funktioniert, zum Beispiel AB12CD.</p>`;
  const i=$(L.step===1?'#l-email':'#l-code');if(i)i.focus();
}
$('#login-x').onclick=closeLogin;

/* ---------- Onboarding ---------- */
let O=null;
function openOnb(){O={step:1,name:'',from:'',to:'',area:'',err:'',boats:[],nb:{name:'',type:'',photo:null},inv:[],ie:'',ib:'',ierr:''};renderOnb();$('#onb').hidden=false;$('#onb').scrollTop=0;const i=$('#o-name');if(i)i.focus();}
function closeOnb(){$('#onb').hidden=true;}
function renderOnb(){
  $$('.steps i').forEach((x,i)=>x.classList.toggle('on',i<O.step));
  $('#onb-step').textContent=`Schritt ${O.step} von 3 · ${['Neuer Törn','Boote','Crew einladen'][O.step-1]}`;
  $('#onb-title').textContent=['Neuer Törn','Boote','Crew einladen'][O.step-1];
  $('#onb-back').hidden=O.step===1;$('#onb-back').onclick=()=>ACT.oback();
  $('#onb-next').textContent=O.step===3?'Törn anlegen':'Weiter';
  let h='';
  if(O.step===1){
    h=`<p class="muted">Du legst den Törn an und wirst damit <b>Admin</b>. Ein Törn enthält immer eine Flottille mit einem oder mehreren Booten.</p>
    <label class="f"><span>Name des Törns</span><input type="text" id="o-name" data-bind="O.name" value="${esc(O.name)}" placeholder="z. B. Ostsee Sommer 2027"></label>
    ${O.err?`<div class="err">${O.err}</div>`:''}
    <div class="row2"><label class="f"><span>Von</span><input type="date" data-bind="O.from" value="${esc(O.from)}"></label><label class="f"><span>Bis</span><input type="date" data-bind="O.to" value="${esc(O.to)}"></label></div>
    <label class="f"><span>Revier (optional)</span><input type="text" data-bind="O.area" value="${esc(O.area)}"></label>`;
  }else if(O.step===2){
    h=`<p class="muted">Lege die Boote der Flottille an (mindestens eins). Weitere kannst du später in der Törn-Verwaltung ergänzen.</p>
    ${O.boats.length?`<ul class="itemlist">${O.boats.map((b,i)=>`<li><span class="thumb-s">${b.photo?`<img src="${b.photo}" alt="">`:boatSVG(i+1)}</span><div><b>${esc(b.name)}</b><div class="muted small">${esc(b.type)}</div></div><span style="--c:var(--b${i+1})">${bsh(i+1)}</span><button class="icon-btn" type="button" data-act="orm" data-id="${i}" aria-label="${esc(b.name)} entfernen">${ico('x',18)}</button></li>`).join('')}</ul>`:'<div class="empty">Noch kein Boot angelegt.</div>'}
    <div class="card"><div class="legend">Boot hinzufügen</div>
      <div class="boatpic">${O.nb.photo?`<img src="${O.nb.photo}" alt="Vorschau">`:boatSVG(Math.min(O.boats.length+1,4))}</div>
      <div class="acts"><button class="btn sm" type="button" data-act="pickphoto" data-id="obphoto">${ico('cam',18)}Foto wählen (optional)</button><input class="sr-only" type="file" accept="image/*" id="obphoto" data-file="obphoto" aria-label="Bootsfoto wählen" tabindex="-1"></div>
      <div class="row2"><label class="f"><span>Bootsname</span><input type="text" id="o-bname" data-bind="O.nb.name" value="${esc(O.nb.name)}" autocomplete="off"></label><label class="f"><span>Typ / Modell</span><input type="text" data-bind="O.nb.type" value="${esc(O.nb.type)}" placeholder="z. B. Bavaria 37"></label></div>
      ${O.err?`<div class="err">${O.err}</div>`:''}
      <button class="btn block" type="button" data-act="oadd">${ico('plus',20)}Boot hinzufügen</button></div>`;
  }else{
    h=`<p class="muted">Lade Personen per E-Mail für den ganzen Törn ein. Das Boot ist nur ein Vorschlag, alle dürfen auf jedes Boot schreiben.</p>`+
    (S.signedIn?`<div class="banner" style="border-left-color:var(--ok)"><b>Angemeldet</b>${esc(S.email)}</div>
    <label class="f"><span>E-Mail-Adresse</span><input type="email" id="o-ie" inputmode="email" autocomplete="off" data-bind="O.ie" value="${esc(O.ie)}" placeholder="name@example.com"></label>
    <fieldset><legend>Boot-Vorschlag (optional)</legend><div class="chips bchips" role="radiogroup" aria-label="Boot-Vorschlag">${O.boats.map((b,i)=>`<button class="chip" type="button" role="radio" data-act="oib" data-id="${i+1}" style="--c:var(--b${i+1})" aria-checked="${O.ib==String(i+1)}">${bsh(i+1)}${esc(b.name)}</button>`).join('').replace(/^/,`<button class="chip" type="button" role="radio" data-act="oib" data-id="" aria-checked="${O.ib===''}">Kein Vorschlag</button>`)}</div></fieldset>
    ${O.ierr?`<div class="err">${O.ierr}</div>`:''}
    <button class="btn block" type="button" data-act="oinv">${ico('mail',20)}Zur Liste hinzufügen</button>
    ${O.inv.length?`<ul class="itemlist">${O.inv.map((x,i)=>`<li><i class="av sm">${initials(nameFromEmail(x.email))}</i><div><b>${esc(x.email)}</b><div class="muted small">${x.ib?'':''}${x.boat?'Vorschlag: '+esc(O.boats[+x.boat-1].name):'Kein Boot-Vorschlag'}</div></div><span class="st warn">wird eingeladen</span><button class="icon-btn" type="button" data-act="oirm" data-id="${i}" aria-label="${esc(x.email)} entfernen">${ico('x',18)}</button></li>`).join('')}</ul>`:''}`
    :lockCard('Einladen geht erst nach der Anmeldung mit deinem Cloud-Konto (E-Mail-Code). Du kannst den Törn auch ohne Anmeldung anlegen und rein lokal nutzen. Eingeladen wird dann später.'));
  }
  $('#onb-body').innerHTML=h;
}
function onbNext(){
  if(O.step===1&&!O.name.trim()){O.err='Bitte gib dem Törn einen Namen.';renderOnb();const i=$('#o-name');if(i)i.focus();return;}
  if(O.step===1)O.err='';
  if(O.step===2&&!O.boats.length){O.err='Bitte lege mindestens ein Boot an.';renderOnb();const i=$('#o-bname');if(i)i.focus();return;}
  if(O.step===2)O.err='';
  if(O.step<3){O.step++;renderOnb();$('#onb').scrollTop=0;return;}
  finishOnb();
}
function finishOnb(){
  const boats=O.boats.map((b,i)=>({id:'b'+(i+1),name:b.name,type:b.type,ci:i+1,photo:b.photo}));
  const me=S.people.find(p=>p.admin)||{name:'Anna'};
  const people=[{id:'p1',name:me.name,email:S.email||'anna@example.com',admin:true,status:'angenommen',pre:boats[0].id}];
  O.inv.forEach((iv,i)=>people.push({id:'p'+(i+2),name:nameFromEmail(iv.email),email:iv.email,admin:false,status:'eingeladen',pre:iv.boat?'b'+iv.boat:null}));
  pidn=people.length+1;bseq=boats.length+1;
  const keep={signedIn:S.signedIn,email:S.email},nt=O.name.trim(),nInv=O.inv.length;
  S=Object.assign(seed(),{trip:{name:nt,from:O.from,to:O.to,area:O.area},signedIn:keep.signedIn,email:keep.email,boats,people,entries:[],reports:[],today:1,day:1,view:'heute',sel:VARIANT==='switch'?boats[0].id:'all',dev:{}});
  closeOnb();render();window.scrollTo(0,0);
  toast(`Törn „${nt}“ angelegt · du bist Admin · ${boats.length} Boot${boats.length>1?'e':''}${nInv?' · '+nInv+' Einladung'+(nInv>1?'en':'')+' vorgemerkt':''}`,4600);
}
$('#onb-x').onclick=closeOnb;$('#onb-next').onclick=()=>ACT.onext();

/* ========== Variante 2: Gemeinsame Timeline ========== */
function dayFilter(){
  return `<div class="filt" role="group" aria-label="Filter nach Boot"><span class="lg">Filter · optional</span><button class="chip" type="button" data-act="filt" data-id="all" aria-pressed="${S.sel==='all'}">Alle Boote</button>${S.boats.map(b=>`<button class="chip" type="button" data-act="filt" data-id="${b.id}" style="${bcol(b)}" aria-pressed="${S.sel===b.id}">${bsh(b.ci)}${esc(b.name)}</button>`).join('')}</div>`;
}
const topExtra=()=>'';
function viewHeute(){
  const ids=shownIds(),es=dayEntries(S.today,ids),sg=suggestBoat();
  const fix=`<button class="fix" id="fix" type="button" data-act="fix"><span id="fix-ico">${ico('eintrag',40)}</span><span class="lbl"><span id="fix-lbl">Eintrag jetzt</span><small id="fix-sub">${sg?'Boot wählst du im Formular · zuletzt: '+esc(boatById(sg).name):'Boot wählst du im Formular'}</small></span></button>`;
  return `${fix}
  ${mapBlock(ids,[S.today],'Karte der heutigen Routen')}${boatKey(ids)}
  <div class="stats">${statTiles(ids,S.today)}</div>
  ${dayFilter()}
  <div class="legend">Tag ${S.today} · ${dayLabel(S.today)} · gemeinsame Timeline</div>
  ${timeline(es.slice().reverse(),true,'Heute noch keine Einträge.')}`;
}
function prow(p){
  const sel=S.moveSel===p.id;
  return `<li class="prow${sel?' sel':''}" style="flex-wrap:wrap"${adminOn()?` draggable="true"`:''} data-pid="${p.id}"><button class="prow-btn" type="button" data-act="psel" data-id="${p.id}" aria-pressed="${sel}" aria-label="${esc(p.name)}${adminOn()?(sel?' ausgewählt, Boot als Ziel wählen':' zum Umsetzen auswählen'):''}"><i class="av">${initials(p.name)}</i><span class="nm"><b>${esc(p.name)}</b>${p.admin?'<span class="role">Admin</span> ':''}${p.id===S.me?'<span class="who me">(du)</span>':''}<span class="muted">${esc(p.email)}</span></span>${memberStatus(p)}${adminOn()?`<span class="muted" aria-hidden="true">${ico('swap',20)}</span>`:''}</button>${memberActs(p)?`<div style="flex:1 0 100%;padding-bottom:10px">${memberActs(p)}</div>`:''}</li>`;
}
function planGroup(b){
  const bid=b?b.id:'',mem=S.people.filter(p=>(p.pre||'')===bid),sp=S.moveSel&&adminOn()?personById(S.moveSel):null;
  const here=sp&&(sp.pre||'')===bid;
  return `<section class="pgroup" data-bid="${bid}"${b?` style="${bcol(b)}"`:''} aria-label="${b?esc(b.name):'Ohne Boot-Vorschlag'}">
  <div class="pg-h"><div>${b?`<b>${bsh(b.ci)} ${esc(b.name)}</b><div class="muted small">${esc(b.type)} · ${mem.length} ${mem.length===1?'Person':'Personen'}</div>`:`<b>Kein Vorschlag</b><div class="muted small">${mem.length} ${mem.length===1?'Person':'Personen'}</div>`}</div>${sp?(here?'<span class="muted small">bereits hier</span>':`<button class="btn primary sm" type="button" data-act="moveto" data-id="${bid}">${sp.name} hierher setzen</button>`):''}</div>
  ${mem.length?`<ul class="plist">${mem.map(prow).join('')}</ul>`:'<div class="pempty" style="border-top:1px solid var(--line)">Niemand zugewiesen.</div>'}</section>`;
}
function boatRow(b){
  const n=S.entries.filter(e=>e.boat===b.id).length;
  return `<article class="card bcard" style="${bcol(b)}"><div class="brow"><span class="thumb-s">${boatPic(b)}</span><div><b>${esc(b.name)}</b><div class="muted small">${esc(b.type)} · ${n} Einträge</div></div>${bsh(b.ci)}</div>${boatAdminActs(b)}</article>`;
}
function viewToern(){
  const sp=S.moveSel&&personById(S.moveSel);
  return `<h2>Törn-Verwaltung</h2>${accountCard()}${asCard()}${rulesCard()}
  <div class="legend">Crew-Plan</div>
  <p class="muted">${adminOn()?(sp?`<b>${esc(sp.name)}</b> ist ausgewählt. Wähle unten ein Boot als Ziel, oder tippe die Person erneut an.`:'Person antippen, dann beim Ziel-Boot „hierher setzen“ wählen (am Rechner auch per Ziehen). Die Zuordnung ist nur ein Vorschlag.'):'Der Plan zeigt, wer welchem Boot vorgeschlagen ist. Nur der Admin kann umsetzen. Schreiben darf trotzdem jede Person auf jedes Boot.'}</p>
  ${S.boats.map(planGroup).join('')}${planGroup(null)}
  <div class="legend">Crew einladen</div>${inviteBlock()}
  <div class="legend">Boote · ${S.boats.length}</div>${S.boats.map(boatRow).join('')}${addBoatCard()}${newTripBtn()}`;
}
function init(){
  $$('[data-ico]').forEach(el=>el.innerHTML=ico(el.dataset.ico,el.classList.contains('icon-btn')?22:24));
  $('#sh-close').innerHTML=ico('x',22);
  buildSheet();themeIcon();render();
}
init();
</script>
</body>
</html>
