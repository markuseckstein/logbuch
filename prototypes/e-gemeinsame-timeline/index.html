<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Logbuch Gemeinsame Timeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f5f6f2; --surface:#ffffff; --surface-2:#e9f1f4; --water-deep:#ffffff; --water-mid:#e4f0f5; --water-shallow:#c9e1ec;
  --land:#ecdcae; --land-edge:#8f7840; --ink:#0d2848; --ink-2:#4b5f76; --line:#c5d2db; --grid:#a8739f;
  --magenta:#b0106a; --on-magenta:#ffffff; --danger:#a3201a; --toast-bg:#0d2848; --toast-ink:#ffffff;
  --scrim:rgba(13,40,72,.5); --shadow:0 -6px 24px rgba(13,40,72,.22);
  --b1:#0a66a8; --b2:#c4560a; --b3:#23823f; --b4:#7a3fb0;
  --ok:#1d6b3a; --ok-bg:#dff0e3; --warn:#7a5000; --warn-bg:#f8ecc9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120e0c; --surface:#1d1613; --surface-2:#271d18; --water-deep:#15110f; --water-mid:#1b1e1c; --water-shallow:#242d2b;
    --land:#3b2e1c; --land-edge:#7a6236; --ink:#e3c28f; --ink-2:#a58d6b; --line:#3d3029; --grid:#7a5069;
    --magenta:#e07a98; --on-magenta:#1a0a10; --danger:#e5806f; --toast-bg:#e3c28f; --toast-ink:#120e0c;
    --scrim:rgba(0,0,0,.7); --shadow:0 -6px 24px rgba(0,0,0,.6);
    --b1:#6cbcf0; --b2:#f2a15a; --b3:#7fd490; --b4:#c39af0;
    --ok:#8fd9a3; --ok-bg:#1e2c22; --warn:#e8c16a; --warn-bg:#33291a;
  }
}
:root[data-theme="dark"]{
  --bg:#120e0c; --surface:#1d1613; --surface-2:#271d18; --water-deep:#15110f; --water-mid:#1b1e1c; --water-shallow:#242d2b;
  --land:#3b2e1c; --land-edge:#7a6236; --ink:#e3c28f; --ink-2:#a58d6b; --line:#3d3029; --grid:#7a5069;
  --magenta:#e07a98; --on-magenta:#1a0a10; --danger:#e5806f; --toast-bg:#e3c28f; --toast-ink:#120e0c;
  --scrim:rgba(0,0,0,.7); --shadow:0 -6px 24px rgba(0,0,0,.6);
  --b1:#6cbcf0; --b2:#f2a15a; --b3:#7fd490; --b4:#c39af0;
  --ok:#8fd9a3; --ok-bg:#1e2c22; --warn:#e8c16a; --warn-bg:#33291a;
}
:root{
  --font-mono:"IBM Plex Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-sans:"Source Sans 3","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--font-sans);overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{flex:none;display:block}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:10;padding:10px 16px;background:var(--bg);border-bottom:3px double var(--ink)}
.tb-row{display:flex;align-items:center;gap:12px}
.topbar .brand{flex:1;min-width:0}
.brand b{display:block;font:600 13px var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.brand span{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.screen{padding:16px}
.screen>*+*{margin-top:16px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.2}
h2{font-size:22px}h3{font-size:18px}
.legend{display:flex;align-items:center;gap:10px;font:600 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.legend::after{content:"";flex:1;border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.card>*+*{margin-top:12px}
.muted{color:var(--ink-2);font-size:15px}
.small{font-size:14px}
p{margin:0}
/* map */
.mapframe{border:1px solid var(--ink);padding:3px;background:var(--surface);border-radius:2px}
.mapframe svg{display:block;width:100%;height:auto;border:1px solid var(--ink)}
.mk{cursor:pointer}
.mk:focus-visible{outline:none}
.mk:focus-visible .ring{stroke:var(--ink);stroke-width:3.5}
/* fix */
.fix{position:relative;width:100%;min-height:96px;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;background:var(--magenta);color:var(--on-magenta);border-radius:8px;font:700 26px/1.15 var(--font-sans);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--magenta);animation:pulse 2.8s ease-out infinite}
.fix small{display:block;font:500 13px var(--font-mono);opacity:.92;letter-spacing:.02em;margin-top:2px}
.fix .lbl{text-align:left;min-width:0}
.fix.busy{animation:none}
.fix.busy .ico{animation:spin 1s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--magenta),0 0 0 5px transparent}70%,100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--magenta),0 0 0 18px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
.fix:active{transform:scale(.985)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);border-radius:2px;background:var(--surface)}
.stats div{padding:10px 8px;text-align:center;min-width:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:600 22px var(--font-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
/* boat badge + shapes */
.bsh{display:inline-block;width:12px;height:12px;flex:none;background:var(--c);vertical-align:middle}
.bsh.s1{border-radius:50%}.bsh.s2{border-radius:2px}
.bsh.s3{clip-path:polygon(50% 0,100% 90%,0 90%)}
.bsh.s4{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.bb{display:inline-flex;align-items:center;gap:6px;max-width:100%;font:600 12px var(--font-mono);letter-spacing:.02em;border:1.5px solid var(--c);border-radius:4px;padding:1px 7px 1px 6px;background:var(--surface);color:var(--ink);white-space:nowrap}
.who{font:500 13px var(--font-mono);color:var(--ink-2)}
.who.me{color:var(--ink);font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:74px;top:0;bottom:0;border-left:1px solid var(--ink-2)}
.tl li:last-child::before{bottom:50%}
.tl-item{position:relative;display:grid;grid-template-columns:50px 26px minmax(0,1fr);gap:10px;width:100%;min-height:64px;padding:10px 0;text-align:left;align-items:start}
.tl-time{font:600 15px var(--font-mono);padding-top:6px;font-variant-numeric:tabular-nums}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--magenta));color:var(--c,var(--magenta));display:flex;align-items:center;justify-content:center;margin-top:3px;z-index:1;margin-left:2px}
.tl-dot .ico{width:15px;height:15px}
.tl-body{display:block;min-width:0}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.tl-head b{font-size:18px}
.pos{display:block;font:400 13px var(--font-mono);color:var(--ink-2);margin-top:2px}
.wind{display:inline-flex;align-items:center;gap:4px;font:500 13px var(--font-mono);border:1px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--surface-2)}
.wind svg{width:12px;height:12px}
.tl-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:16px}
.empty{padding:16px;border:1px dashed var(--ink-2);border-radius:6px;text-align:center;color:var(--ink-2)}
/* chips */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:8px;font:600 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
legend em{font-style:normal;color:var(--magenta);letter-spacing:.04em;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink-2);border-radius:22px;background:var(--surface);font-size:16px;max-width:100%}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip .bsh{box-shadow:0 0 0 1.5px var(--surface)}
.chip[aria-checked="true"] .bsh,.chip[aria-pressed="true"] .bsh{box-shadow:0 0 0 1.5px var(--bg)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .chip{border-radius:6px;flex-direction:column;gap:2px;justify-content:center;font-size:14px;padding:6px 4px;text-align:center}
/* segmented boat switch */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:10px;background:var(--surface)}
.seg button{min-height:46px;padding:4px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--font-sans);min-width:0}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg .bsh{box-shadow:0 0 0 1.5px var(--surface)}
.seg button[aria-checked="true"] .bsh{box-shadow:0 0 0 1.5px var(--bg)}
.seg.flash{animation:flash .9s ease-out 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--magenta)}}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;height:92%;max-height:92%;z-index:31;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow);border-top:3px double var(--ink);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s ease-out}
.sheet.open{transform:none}
.sh-head{padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.grab{width:44px;height:4px;border-radius:2px;background:var(--ink-2);margin:0 auto 8px;opacity:.5}
.sh-row{display:flex;align-items:center;gap:12px}
.sh-row>div{flex:1;min-width:0}
.sh-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;overscroll-behavior:contain}
.sh-body>*+*{margin-top:20px}
#sh-form>*+*{margin-top:20px}
.sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:12px;flex-wrap:wrap}
.banner{border:1.5px solid var(--ink-2);border-left-width:6px;border-radius:6px;padding:10px 12px;background:var(--surface);font-size:15px}
.banner b{display:block}
.btn{min-height:48px;padding:8px 18px;border-radius:6px;border:1.5px solid var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);text-align:center}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:15px}
.btn.block{width:100%}
.btn[aria-disabled="true"]{opacity:.45}
.sh-foot .primary{flex:1}
.confirm{width:100%;border:1.5px solid var(--danger);border-radius:6px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface)}
.confirm p{margin:0;flex:1 1 100%;font-weight:600;color:var(--danger)}
/* rose */
.rose-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.rose{width:min(100%,264px);height:auto}
.rose .w{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:.6;cursor:pointer}
.rose .w.card4{fill:var(--water-shallow)}
.rose .w[aria-checked="true"]{fill:var(--magenta)}
.rose .w:focus-visible{outline:none;stroke:var(--magenta);stroke-width:2.5}
.rose text{font:500 8.5px var(--font-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rose .ctr{font:600 14px var(--font-mono)}
.windbar{display:flex;align-items:center;gap:12px}
.windbar output{font:600 16px var(--font-mono);min-width:150px;text-align:center}
.bft{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bft button{min-height:48px;border:1px solid var(--ink-2);border-radius:4px;font:600 17px var(--font-mono);background:color-mix(in srgb,var(--magenta) calc(var(--lv)*32%),var(--surface))}
.bft button[aria-pressed="true"]{background:var(--magenta);color:var(--on-magenta);border-color:var(--magenta)}
.bft-desc{margin-top:8px;font-size:17px}
.bft-desc small{font:400 13px var(--font-mono);color:var(--ink-2);margin-left:6px}
/* forms */
label.f{display:block}
label.f>span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px;font-weight:600}
input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--ink-2);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.err{color:var(--danger);font-size:14px;font-weight:600;margin-top:4px}
.hint{margin-top:8px}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink-2);border-top:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--magenta)}
.tab[aria-current="page"] .ico{color:var(--magenta)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:448px;z-index:60;background:var(--toast-bg);color:var(--toast-ink);padding:12px 16px;border-radius:6px;font:500 14px/1.4 var(--font-mono);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
/* role + status */
.role{font:600 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--magenta);color:var(--magenta);border-radius:3px;padding:1px 6px;white-space:nowrap}
.st{font:600 12px var(--font-mono);letter-spacing:.04em;border-radius:3px;padding:2px 7px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.st.warn{background:var(--warn-bg);color:var(--warn);border:1px dashed var(--warn)}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font:600 14px var(--font-mono);font-style:normal}
.av.sm{width:26px;height:26px;font-size:12px}
/* day nav */
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700;color:var(--magenta)}
/* report */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.rep+.rep{margin-top:12px}
.rep-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rep-h b{font-size:18px}
.rep-h .num{margin-left:auto;font-size:14px;color:var(--ink-2)}
.rep p{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.rep.mine{border-color:var(--ink);border-width:1.5px}
.rep.new{border-style:dashed;border-color:var(--ink-2)}
.rep-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rep textarea{margin-top:10px;min-height:120px}
.dtbl{width:100%;border-collapse:collapse}
.dtbl td{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.dtbl td:last-child{text-align:right;font:500 14px var(--font-mono)}
.dtbl tr:last-child td{border-bottom:0}
/* map legend */
.mleg{list-style:none;margin:0;padding:0}
.mleg li+li{border-top:1px solid var(--line)}
.mleg button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;padding:6px 0}
.mleg .bsh{width:16px;height:16px}
.mleg .ml-t{flex:1;min-width:0}
.mleg .ml-t b{display:block}
.mleg .ml-t span{font:400 13px var(--font-mono);color:var(--ink-2)}
.mleg button[aria-pressed="false"] .ml-t,.mleg button[aria-pressed="false"] .bsh{opacity:.4}
.mleg .sw{flex:none;font:600 12px var(--font-mono);color:var(--ink-2)}
/* boats + people */
.boatpic{height:130px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;position:relative;background:var(--water-mid)}
.boatpic svg,.boatpic img{width:100%;height:100%;object-fit:cover;display:block}
.bcard{border-left:6px solid var(--c)}
.bc-head{display:flex;align-items:center;gap:10px}
.bc-head>div{flex:1;min-width:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 10px 2px 4px;border:1px solid var(--ink-2);border-radius:18px;background:var(--surface);font-size:15px}
.pchip.inv{border-style:dashed;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.members{list-style:none;margin:0;padding:0}
.mem{padding:12px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem-top{display:flex;align-items:center;gap:10px}
.mem-main{flex:1;min-width:0}
.mem-main b{margin-right:6px}
.mem-main .muted{font-size:14px;overflow-wrap:anywhere}
.mem-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mem-acts select{width:auto;min-height:44px;flex:1 1 150px}
.rules{margin:0;padding-left:20px}
.rules li+li{margin-top:4px}
.lockcard{border:1.5px dashed var(--ink-2);border-radius:6px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.lockcard .row{display:flex;gap:10px;align-items:flex-start}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acct>div{flex:1;min-width:150px}
/* crew plan */
.pgroup{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c,var(--ink-2));border-radius:6px}
.pgroup.drop{outline:3px dashed var(--magenta);outline-offset:2px}
.pg-h{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.pg-h>div{flex:1;min-width:120px}
.pg-h b{font-size:18px}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 12px;min-height:56px}
.prow:last-child{border-bottom:0}
.prow.sel{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--magenta)}
.prow[draggable="true"]{cursor:grab}
.prow-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:56px;text-align:left}
.prow-btn .nm{flex:1;min-width:0}
.prow-btn .nm b{margin-right:6px}
.prow-btn .nm .muted{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pempty{padding:12px;color:var(--ink-2);font-size:15px}
.brow{display:flex;align-items:center;gap:10px}
.brow>div{flex:1;min-width:0}
/* onboarding */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
#login{z-index:55}
.onb-in{max-width:480px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:16px}
.onb-in>section>*+*{margin-top:12px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border:1px solid var(--ink);border-radius:3px}
.steps i.on{background:var(--magenta);border-color:var(--magenta)}
.onb-nav{margin-top:auto;display:flex;gap:12px;padding-top:12px}
.onb-nav .primary{flex:1}
.itemlist{list-style:none;margin:0;padding:0}
.itemlist li{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.itemlist li>div{flex:1;min-width:0}
.thumb-s{width:44px;height:36px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;flex:none;background:var(--water-mid)}
.thumb-s svg,.thumb-s img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
details.opt{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details.opt summary{min-height:48px;padding:0 12px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details.opt .in{padding:0 12px 12px}
details.opt .in>*+*{margin-top:8px}
.dim{border-style:dashed;background:transparent}
.tl li::before{display:none}
.tl li+li{margin-top:10px}
.tl-item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:10px 12px 10px 10px;grid-template-columns:46px 26px minmax(0,1fr);gap:8px}
.tl-dot{margin-left:0}
.tl-time{font-size:14px}
.bchips .chip{border-radius:8px}
.bchips .chip[aria-checked="true"]{background:var(--surface);color:var(--ink);border:2.5px solid var(--c,var(--ink));font-weight:700}
.bchips .chip[aria-checked="true"] .bsh{box-shadow:0 0 0 1.5px var(--surface)}
.bchips .chip{min-height:48px}
.filt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filt .lg{font:600 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);width:100%}

<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="tb-row">
      <div class="brand"><b>Logbuch</b><span id="tb-sub"></span></div>
      <span class="role" id="tb-role" hidden>Admin</span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Darstellung wechseln (Tag / Nachtfahrt)"></button>
    </div>
    <div id="tb-extra"></div>
  </header>

  <main class="screen" id="view"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button class="tab" type="button" data-act="go" data-id="heute"><span data-ico="tab-heute"></span>Heute</button>
    <button class="tab" type="button" data-act="go" data-id="tag"><span data-ico="tab-tage"></span>Tag</button>
    <button class="tab" type="button" data-act="go" data-id="karte"><span data-ico="tab-karte"></span>Karte</button>
    <button class="tab" type="button" data-act="go" data-id="toern"><span data-ico="tab-toern"></span>Törn</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="sh-head">
    <div class="grab"></div>
    <div class="sh-row">
      <div><h2 id="sh-title">Eintrag</h2><div class="mono muted" id="sh-pos"></div></div>
      <button class="icon-btn" id="sh-close" type="button" aria-label="Schließen"></button>
    </div>
  </div>
  <div class="sh-body" id="sh-body">
    <div class="banner" id="sh-ro" hidden></div>
    <div id="sh-form">
      <fieldset id="fs-boat"><legend id="lg-boat">Für welches Boot? <em>Pflicht</em></legend>
        <div class="chips bchips" id="f-boat" role="radiogroup" aria-labelledby="lg-boat"></div>
        <div class="err" id="boat-err" hidden>Bitte zuerst ein Boot wählen.</div>
        <div class="muted small hint" id="boat-hint"></div>
      </fieldset>
      <fieldset><legend>Typ</legend><div class="chips" id="f-type" role="radiogroup" aria-label="Eintragstyp"></div></fieldset>
      <fieldset><legend>Windrichtung (Wind aus …)</legend>
        <div class="rose-wrap">
          <svg class="rose" id="rose" viewBox="0 0 200 200" role="radiogroup" aria-label="Windrichtung"></svg>
          <div class="windbar">
            <button class="icon-btn" id="wd-prev" type="button" aria-label="Eine Richtung zurück" data-ico="chev-l"></button>
            <output id="wd-out" for="rose">keine Angabe</output>
            <button class="icon-btn" id="wd-next" type="button" aria-label="Eine Richtung weiter" data-ico="chev-r"></button>
          </div>
        </div>
      </fieldset>
      <fieldset><legend>Windstärke (Beaufort)</legend>
        <div class="bft" id="f-bft"></div>
        <div class="bft-desc" id="bft-desc">Nicht gesetzt</div>
      </fieldset>
      <fieldset><legend>Wetter</legend><div class="grid3" id="f-wx"></div></fieldset>
      <label class="f"><span>Text</span><textarea id="f-text" placeholder="Was ist passiert? Kurs, Segelstellung, Stimmung …"></textarea></label>
    </div>
    <div class="muted small" id="sh-by"></div>
  </div>
  <div class="sh-foot">
    <div class="confirm" id="del-confirm" hidden>
      <p>Diesen Eintrag wirklich löschen?</p>
      <button class="btn" id="del-no" type="button">Abbrechen</button>
      <button class="btn danger" id="del-yes" type="button">Endgültig löschen</button>
    </div>
    <button class="btn danger" id="f-del" type="button"><span data-ico="trash"></span>Löschen</button>
    <button class="btn primary" id="f-save" type="button">Speichern</button>
    <button class="btn block" id="f-close" type="button" hidden>Schließen</button>
  </div>
</section>

<div class="onb" id="onb" role="dialog" aria-modal="true" aria-labelledby="onb-title" hidden>

      <button class="icon-btn" id="onb-x" type="button" aria-label="Abbrechen" data-ico="x"></button>
    </div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2 id="onb-title">Neuer Törn</h2>
    <section id="onb-body"></section>
    <div class="onb-nav">
      <button class="btn" id="onb-back" type="button">Zurück</button>
      <button class="btn primary" id="onb-next" type="button">Weiter</button>
    </div>
  </div>
</div>

<div class="onb" id="login" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>

    <div style="display:flex;align-items:center;gap:12px">

const VARIANT='shared';

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

};
const ico=(n,s=22)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- Domäne ---------- */
const TYPES=[['eintrag','Eintrag'],['ablegen','Ablegen'],['hafen','Hafen'],['anker','Ankerplatz'],['boje','Boje'],['segelan','Segel setzen'],['segelab','Segel bergen'],['motor','Motor an/aus'],['sichtung','Sichtung'],['sonst','Sonstiges']];
const TLABEL=Object.fromEntries(TYPES);
const WX=[['sonne','Sonne'],['leicht','Leicht bewölkt'],['bewoelkt','Bewölkt'],['regen','Regen'],['gewitter','Gewitter'],['nebel','Nebel']];
const DIRS=['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const BFT=[['Windstille','< 1'],['leiser Zug','1–3'],['leichte Brise','4–6'],['schwache Brise','7–10'],['mäßige Brise','11–16'],['frische Brise','17–21'],['starker Wind','22–27'],['steifer Wind','28–33'],['stürmischer Wind','34–40'],['Sturm','41–47'],['schwerer Sturm','48–55'],['orkanartiger Sturm','56–63'],['Orkan','≥ 64']];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad=n=>String(n).padStart(2,'0');

let nid=1, pidn=7;
const ME=(day,boat,t,lat,lon,type,dir,bft,wx,text,by)=>({id:'e'+(nid++),day,boat,t,lat,lon,type,dir,bft,wx,text,by});
function seed(){

    people:[

      {id:'p2',name:'Ben',email:'ben@example.com',admin:false,status:'angenommen',pre:'b1'},
      {id:'p3',name:'Chris',email:'chris@example.com',admin:false,status:'eingeladen',pre:'b1'},
      {id:'p4',name:'Dana',email:'dana@example.com',admin:false,status:'angenommen',pre:'b2'},
      {id:'p5',name:'Emil',email:'emil@example.com',admin:false,status:'angenommen',pre:'b2'},

    ],
    me:'p1', dev:{}, today:3, day:3, view:'heute', sel:VARIANT==='switch'?'b1':'all',
    mapDay:0, mapOff:{}, clock:14*60+30, fix:0,
    entries:[
      ME(1,'b1','10:05',54.436,10.190,'ablegen',10,3,'leicht','Leinen los in Schilksee. Alle an Bord, Rettungswesten an.','p1'),
      ME(1,'b1','11:20',54.470,10.130,'segelan',10,4,'sonne','Großsegel im ersten Reff, Genua voll. Kurs West Richtung Eckernförder Bucht.','p2'),
      ME(1,'b1','13:00',54.485,10.090,'eintrag',11,4,'sonne','Halber Wind, 6 kn über Grund. Mittagessen im Cockpit.','p1'),
      ME(1,'b1','15:30',54.500,10.050,'anker',10,3,'leicht','Anker gefallen vor dem Strand, 6 m Wassertiefe. Baden!','p4'),
      ME(1,'b2','10:40',54.432,10.246,'ablegen',8,2,'sonne','Ablegen in Laboe, kaum Wind.','p4'),
      ME(1,'b2','12:15',54.465,10.300,'segelan',9,3,'sonne','Segel gesetzt, Kurs Nordost.','p5'),
      ME(1,'b2','14:30',54.445,10.345,'sichtung',10,3,'leicht','Schweinswale querab, zwei Tiere.','p5'),
      ME(1,'b2','16:10',54.440,10.275,'hafen',9,3,'leicht','Zurück in Laboe, Gästehafen. Fischbrötchen für alle.','p4'),
      ME(2,'b1','09:50',54.500,10.050,'ablegen',12,3,'bewoelkt','Anker auf, Frühstück unterwegs.','p2'),
      ME(2,'b1','12:10',54.520,10.150,'eintrag',12,4,'regen','Kurze Schauer, Ölzeug an. Danach wieder Sonne.','p1'),
      ME(2,'b1','14:40',54.500,10.240,'segelab',11,4,'bewoelkt','Segel runter vor der Förde, Motor an.','p2'),
      ME(2,'b1','15:25',54.436,10.190,'hafen',11,3,'leicht','Fest in Schilksee.','p1'),

    ],
    reports:[
      {day:1,by:'p1',t:'17:40',text:'Erster Tag: Raus aus der Förde, dann West bis vor Eckernförde. Seeschwalbe ankert, abends Grillen an Bord.'},

      {day:1,by:'p2',t:'18:20',text:'Windstärke 4, perfekt zum Eingewöhnen.'},

    ],
    editBoat:null, confirm:null, moveSel:null, repEdit:null, repDraft:'',

let S=seed();

const boatById=id=>S.boats.find(b=>b.id===id);
const personById=id=>S.people.find(p=>p.id===id);
const meP=()=>personById(S.me);
const isAdmin=()=>!!meP().admin;
const adminOn=()=>isAdmin()&&S.signedIn;
const canEdit=e=>isAdmin()||e.by===S.me;
const pname=id=>personById(id)?.name??'Ehemalig';
const whoLbl=id=>id===S.me?'Du':pname(id);
const initials=n=>String(n||'?').trim().slice(0,1).toUpperCase();
const byT=(a,b)=>a.t.localeCompare(b.t);
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const f1=n=>n.toFixed(1).replace('.',',');
function suggestBoat(){const d=S.dev[S.me];if(d&&boatById(d))return d;const p=meP().pre;return p&&boatById(p)?p:null;}
function nowT(){const m=S.clock;return pad(Math.floor(m/60))+':'+pad(m%60);}
function dayInfo(n){
  const iso=S.trip.from||new Date().toISOString().slice(0,10);
  const [y,m,d]=iso.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d+n-1));
  return {wd:WD[dt.getUTCDay()],d:pad(dt.getUTCDate()),m:pad(dt.getUTCMonth()+1)};
}
const dayLabel=n=>{const i=dayInfo(n);return `${i.wd} ${i.d}.${i.m}.`;};
function fmtDate(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}.${m}.${y}`;}

/* Koordinaten + Distanz */
const R=3440.065;
function nm(a,b){const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function fc(v,p,n,lon,dec){const h=v>=0?p:n;v=Math.abs(v);let d=Math.floor(v),m=((v-d)*60).toFixed(dec);if(+m>=60){d++;m=(0).toFixed(dec);}return String(d).padStart(lon?3:2,'0')+'°'+m.padStart(2+(dec?dec+1:0),'0').replace('.',',')+'′'+h;}
const fpos=(e,dec=1)=>fc(e.lat,'N','S',false,dec)+' '+fc(e.lon,'E','W',true,dec);

/* Auswahl-Helfer */
const allIds=()=>S.boats.map(b=>b.id);
const shownIds=()=>S.sel==='all'||!boatById(S.sel)?allIds():[S.sel];
const dayEntries=(day,ids)=>S.entries.filter(e=>e.day===day&&ids.includes(e.boat)).sort(byT);
function distOf(es){let s=0;for(let i=1;i<es.length;i++)s+=nm(es[i-1],es[i]);return s;}
function boatDayStats(bid,day){const es=dayEntries(day,[bid]);return{sm:distOf(es),min:es.length>1?mins(es[es.length-1].t)-mins(es[0].t):0,n:es.length};}
function statTiles(ids,day){
  const st=ids.map(i=>boatDayStats(i,day)),sm=st.reduce((a,s)=>a+s.sm,0),n=st.reduce((a,s)=>a+s.n,0);
  if(ids.length===1){const m=st[0].min;return `<div><b>${f1(sm)}</b><span>sm</span></div><div><b>${m?`${Math.floor(m/60)}:${pad(m%60)}`:'–'}</b><span>Fahrtzeit h</span></div><div><b>${n}</b><span>Einträge</span></div>`;}
  const au=new Set(dayEntries(day,ids).map(e=>e.by)).size;
  return `<div><b>${f1(sm)}</b><span>sm gesamt</span></div><div><b>${n}</b><span>Einträge</span></div><div><b>${au}</b><span>Schreibende</span></div>`;
}

/* Boot-Darstellung */
const bsh=ci=>`<i class="bsh s${ci}" aria-hidden="true"></i>`;
const bcol=b=>`--c:var(--b${b.ci})`;
const boatBadge=b=>`<span class="bb" style="${bcol(b)}">${bsh(b.ci)}${esc(b.name)}</span>`;
const boatSVG=ci=>`<svg viewBox="0 0 300 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="140" fill="var(--water-mid)"/><rect y="96" width="300" height="44" fill="var(--water-shallow)"/><path d="M60 98h180l-22 20H84z" fill="var(--b${ci})"/><path d="M148 22v74M148 24l56 66h-56M144 40l-48 50h48" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/></svg>`;
const boatPic=b=>b.photo?`<img src="${b.photo}" alt="Foto ${esc(b.name)}">`:boatSVG(b.ci);

/* ---------- Karte ---------- */
const P=(la,lo)=>[(lo-9.95)*700,(54.62-la)*1200];
const LAND=[
  [[54.49,9.95],[54.47,10.05],[54.46,10.14],[54.457,10.193],[54.43,10.18],[54.40,10.15],[54.33,10.135],[54.33,9.95]],
  [[54.33,10.17],[54.40,10.19],[54.41,10.225],[54.425,10.24],[54.42,10.30],[54.40,10.40],[54.38,10.48],[54.34,10.55],[54.33,10.55]]
];
const PLACES=[['Schilksee',54.436,10.190,-1],['Laboe',54.432,10.246,1],['Hohwacht',54.385,10.500,1]];
const AREAS=[['KIEL',54.360,10.065],['PROBSTEI',54.352,10.36],['SCHWANSEN',54.42,9.99]];
const SOUND=[[54.58,10.15,'21'],[54.52,10.42,'18'],[54.47,10.0,'14'],[54.60,10.5,'24'],[54.44,10.52,'12']];
function mkShape(ci,x,y,r){
  if(ci===2)return `<rect x="${(x-r).toFixed(1)}" y="${(y-r).toFixed(1)}" width="${(2*r).toFixed(1)}" height="${(2*r).toFixed(1)}" rx="1"`;
  if(ci===3)return `<path d="M${x.toFixed(1)} ${(y-r*1.25).toFixed(1)}L${(x+r*1.15).toFixed(1)} ${(y+r*.9).toFixed(1)}L${(x-r*1.15).toFixed(1)} ${(y+r*.9).toFixed(1)}Z"`;
  if(ci===4)return `<path d="M${x.toFixed(1)} ${(y-r*1.35).toFixed(1)}L${(x+r*1.35).toFixed(1)} ${y.toFixed(1)}L${x.toFixed(1)} ${(y+r*1.35).toFixed(1)}L${(x-r*1.35).toFixed(1)} ${y.toFixed(1)}Z"`;
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"`;
}
function bbox(es,aspect=.62,minW=130){
  if(!es.length)return[0,0,420,348];
  const p=es.map(e=>P(e.lat,e.lon)),xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);
  const w=Math.min(420,Math.max((Math.max(...xs)-Math.min(...xs))*1.5,(Math.max(...ys)-Math.min(...ys))*1.5/aspect,minW)),h=w*aspect;
  let x=(Math.min(...xs)+Math.max(...xs))/2-w/2,y=(Math.min(...ys)+Math.max(...ys))/2-h/2;
  x=Math.max(0,Math.min(420-w,x));y=Math.max(0,Math.min(348-h,y));
  return[x,y,w,h];
}
function mapSVG(ids,days,vb,selId,label){
  const [vx,vy,vw,vh]=vb,u=vw/360,f=n=>n.toFixed(1);
  const land=LAND.map(pl=>'M'+pl.map(([a,o])=>P(a,o).map(f).join(',')).join('L')+'Z').join('');
  let s=`<svg viewBox="${vb.map(f).join(' ')}" role="img" aria-label="${esc(label)}">`;
  s+=`<rect x="${f(vx)}" y="${f(vy)}" width="${f(vw)}" height="${f(vh)}" fill="var(--water-deep)"/>`;
  s+=`<path d="${land}" fill="var(--water-mid)" stroke="var(--water-mid)" stroke-width="${f(52*u)}" stroke-linejoin="round"/>`;
  s+=`<path d="${land}" fill="var(--water-shallow)" stroke="var(--water-shallow)" stroke-width="${f(22*u)}" stroke-linejoin="round"/>`;
  const step=(vw>220?10:5)/60;
  for(let la=Math.ceil(54.30/step)*step;la<54.65;la+=step){const y=P(la,0)[1];if(y<vy||y>vy+vh)continue;
    s+=`<line x1="${f(vx)}" x2="${f(vx+vw)}" y1="${f(y)}" y2="${f(y)}" stroke="var(--grid)" stroke-width=".7" vector-effect="non-scaling-stroke"/><text x="${f(vx+4*u)}" y="${f(y-3*u)}" font-size="${f(9*u)}" font-family="IBM Plex Mono,monospace" fill="var(--ink-2)">${fc(la,'N','S',false,0)}</text>`;}
  for(let lo=Math.ceil(9.90/step)*step;lo<10.6;lo+=step){const x=P(0,lo)[0];if(x<vx||x>vx+vw)continue;
    s+=`<line y1="${f(vy)}" y2="${f(vy+vh)}" x1="${f(x)}" x2="${f(x)}" stroke="var(--grid)" stroke-width=".7" vector-effect="non-scaling-stroke"/><text x="${f(x+3*u)}" y="${f(vy+11*u)}" font-size="${f(9*u)}" font-family="IBM Plex Mono,monospace" fill="var(--ink-2)">${fc(lo,'E','W',true,0)}</text>`;}
  s+=`<path d="${land}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  AREAS.forEach(([n,la,lo])=>{const[x,y]=P(la,lo);s+=`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" font-size="${f(10*u)}" font-style="italic" letter-spacing="${f(2*u)}" fill="var(--land-edge)" font-family="Source Sans 3,sans-serif">${n}</text>`;});
  SOUND.forEach(([la,lo,n])=>{const[x,y]=P(la,lo);s+=`<text x="${f(x)}" y="${f(y)}" font-size="${f(9*u)}" font-style="italic" fill="var(--ink-2)" opacity=".8" font-family="IBM Plex Mono,monospace">${n}</text>`;});
  const shown=[];
  ids.forEach(bid=>{const b=boatById(bid);if(!b)return;
    days.forEach(d=>{const es=dayEntries(d,[bid]);if(!es.length)return;shown.push(...es);
      s+=`<polyline points="${es.map(e=>P(e.lat,e.lon).map(f).join(',')).join(' ')}" fill="none" stroke="var(--b${b.ci})" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;});});
  PLACES.forEach(([n,la,lo,side0])=>{const[x,y]=P(la,lo),side=(side0>0&&x+(n.length*6.5+8)*u>vx+vw)?-1:side0;s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(2*u)}" fill="var(--ink)"/><text x="${f(x+side*5*u)}" y="${f(y+13*u)}" ${side<0?'text-anchor="end"':''} font-size="${f(11*u)}" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--water-deep)" stroke-width="${f(3*u)}" font-family="Source Sans 3,sans-serif">${n}</text>`;});
  shown.forEach(e=>{const b=boatById(e.boat),[x,y]=P(e.lat,e.lon),on=e.id===selId,r=(on?6.5:4.2)*u;
    s+=`<g class="mk" data-act="open" data-id="${e.id}" role="button" tabindex="0" aria-label="Eintrag ${e.t}, ${esc(b.name)}, ${TLABEL[e.type]}"><circle cx="${f(x)}" cy="${f(y)}" r="${f(18*u)}" fill="transparent"/>${mkShape(b.ci,x,y,r)} class="ring" fill="var(--b${b.ci})" stroke="${on?'var(--ink)':'var(--surface)'}" stroke-width="${on?3:1.8}" vector-effect="non-scaling-stroke"/></g>`;});
  ids.forEach(bid=>{const b=boatById(bid);if(!b)return;const es=shown.filter(e=>e.boat===bid).sort((a,c)=>a.day-c.day||byT(a,c));if(!es.length)return;const l=es[es.length-1],[x,y]=P(l.lat,l.lon);
    const left=x+(b.name.length*6.5+10)*u>vx+vw;s+=`<text x="${f(left?x-8*u:x+8*u)}" y="${f(y-7*u)}" ${left?'text-anchor="end"':''} font-size="${f(11*u)}" font-weight="700" fill="var(--b${b.ci})" paint-order="stroke" stroke="var(--water-deep)" stroke-width="${f(3.2*u)}" font-family="Source Sans 3,sans-serif">${esc(b.name)}</text>`;});
  const cx=vx+vw-26*u,cy=vy+vh-30*u,k=u*16;
  s+=`<g stroke="var(--magenta)" fill="none" stroke-width="1.2" vector-effect="non-scaling-stroke"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(k*.8)}" vector-effect="non-scaling-stroke"/><path d="M${f(cx)} ${f(cy-k*1.1)}L${f(cx+k*.28)} ${f(cy)}L${f(cx)} ${f(cy+k*1.1)}L${f(cx-k*.28)} ${f(cy)}Z" fill="var(--magenta)" vector-effect="non-scaling-stroke"/></g><text x="${f(cx)}" y="${f(cy-k*1.2)}" text-anchor="middle" font-size="${f(9*u)}" font-weight="700" fill="var(--magenta)" font-family="IBM Plex Mono,monospace">N</text>`;
  const nmB=vh>200?5:1,bh=nmB/60*1200,bx=vx+14*u,by=vy+vh-12*u-bh;
  s+=`<path d="M${f(bx)} ${f(by)}v${f(bh)}M${f(bx-3*u)} ${f(by)}h${f(6*u)}M${f(bx-3*u)} ${f(by+bh)}h${f(6*u)}" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none"/><text x="${f(bx+6*u)}" y="${f(by+bh/2+3*u)}" font-size="${f(9*u)}" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${nmB} sm</text>`;
  return s+'</svg>';
}

/* ---------- Render-Bausteine ---------- */
const windChip=e=>e.dir==null&&e.bft==null?'':`<span class="wind num">${e.dir!=null?`<svg viewBox="0 0 24 24" style="transform:rotate(${e.dir*22.5+180}deg)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 20V4M6 10l6-6 6 6"/></svg>${DIRS[e.dir]}`:''} ${e.bft!=null?e.bft+' Bft':''}</span>`;
function tlItem(e,showBoat){
  const b=boatById(e.boat);
  return `<li style="${bcol(b)}"><button class="tl-item" type="button" data-act="open" data-id="${e.id}" aria-label="Eintrag ${e.t}, ${esc(b.name)}, ${TLABEL[e.type]}, von ${esc(whoLbl(e.by))}">
  <span class="tl-time">${e.t}</span><span class="tl-dot">${ico(e.type,15)}</span>
  <span class="tl-body"><span class="tl-head"><b>${TLABEL[e.type]}</b>${windChip(e)}${e.wx?`<span class="wind" style="background:none;border:0;padding:0">${ico(e.wx,18)}</span>`:''}</span>
  <span class="meta-row">${showBoat?boatBadge(b):''}<span class="who${e.by===S.me?' me':''}">${esc(whoLbl(e.by))}</span></span>
  <span class="pos">${fpos(e)}</span>${e.text?`<span class="tl-text">${esc(e.text)}</span>`:''}</span></button></li>`;
}
const timeline=(es,showBoat,emptyTxt)=>es.length?`<ol class="tl">${es.map(e=>tlItem(e,showBoat)).join('')}</ol>`:`<div class="empty">${emptyTxt||'Noch keine Einträge.'}</div>`;
const mapBlock=(ids,days,label,minW=150)=>`<div class="mapframe">${mapSVG(ids,days,bbox(days.flatMap(d=>dayEntries(d,ids)),.62,minW),S.sh&&S.sh.id||null,label)}</div>`;
const boatKey=ids=>ids.length>1?`<div class="acts" aria-label="Legende">${ids.map(i=>boatBadge(boatById(i))).join('')}</div>`:'';
const dayChips=()=>`<div class="chips" role="group" aria-label="Tag wählen">${Array.from({length:S.today},(_,i)=>i+1).map(n=>`<button class="chip" type="button" data-act="day" data-id="${n}" aria-pressed="${S.day===n}"><span class="num">Tag ${n}</span> <span class="muted" style="color:inherit;opacity:.8">${dayLabel(n)}</span></button>`).join('')}</div>`;
const boatChipsHTML=(act,selected,withNone)=>`${withNone?`<button class="chip" type="button" role="radio" data-act="${act}" data-id="" aria-checked="${selected===''}">Kein Vorschlag</button>`:''}${S.boats.map(b=>`<button class="chip" type="button" role="radio" data-act="${act}" data-id="${b.id}" style="${bcol(b)}" aria-checked="${selected===b.id}">${bsh(b.ci)}${esc(b.name)}</button>`).join('')}`;

/* Tagesbericht */
const canRep=r=>isAdmin()||r.by===S.me;
function repHead(by,t,extra=''){const p=personById(by);return `<div class="rep-h"><i class="av sm">${initials(pname(by))}</i><b>${esc(pname(by))}${by===S.me?' <span class="who me">(du)</span>':''}</b>${p&&p.admin?'<span class="role">Admin</span>':''}${extra}${t?`<span class="num">${t} Uhr</span>`:''}</div>`;}
function repCard(r,n){
  const ed=S.repEdit&&S.repEdit.day===n&&S.repEdit.by===r.by, cf=S.confirm&&S.confirm.kind==='rep'&&S.confirm.id===r.by;
  let h=`<article class="rep${r.by===S.me?' mine':''}">${repHead(r.by,r.t)}`;
  if(ed){
    h+=`<textarea id="rep-text" data-bind="S.repDraft" aria-label="Abschnitt von ${esc(pname(r.by))}">${esc(S.repDraft)}</textarea><div class="rep-act"><button class="btn primary sm" type="button" data-act="repsave">Speichern</button><button class="btn sm" type="button" data-act="repcancel">Abbrechen</button><button class="btn danger sm" type="button" data-act="repdel" data-id="${r.by}">Löschen</button></div>`;
    if(cf)h+=`<div class="confirm" style="margin-top:10px"><p>Abschnitt wirklich löschen?</p><button class="btn sm" type="button" data-act="repno">Abbrechen</button><button class="btn danger sm" type="button" data-act="repyes">Endgültig löschen</button></div>`;
  }else{
    h+=`<p>${esc(r.text)}</p>`;
    if(canRep(r))h+=`<div class="rep-act"><button class="btn sm" type="button" data-act="repedit" data-id="${r.by}">${ico('edit',18)}Bearbeiten${r.by!==S.me?' (Admin)':''}</button></div>`;
  }
  return h+'</article>';
}
function reportsHTML(n){
  const rs=S.reports.filter(r=>r.day===n).sort(byT);
  let h=`<div class="legend">Tagesbericht</div><p class="muted">Jede Person schreibt ihren eigenen kurzen Abschnitt. Die Abschnitte stehen untereinander, eigene kannst du ändern.</p><div>${rs.map(r=>repCard(r,n)).join('')}`;
  if(!rs.some(r=>r.by===S.me)){
    const ed=S.repEdit&&S.repEdit.day===n&&S.repEdit.by===S.me;
    h+=`<article class="rep new mine">${repHead(S.me,'')}`+(ed?`<textarea id="rep-text" data-bind="S.repDraft" placeholder="Kurze Zusammenfassung des Tages …" aria-label="Dein Abschnitt">${esc(S.repDraft)}</textarea><div class="rep-act"><button class="btn primary sm" type="button" data-act="repsave">Speichern</button><button class="btn sm" type="button" data-act="repcancel">Abbrechen</button></div>`:`<p class="muted">Noch kein Abschnitt von dir für diesen Tag.</p><div class="rep-act"><button class="btn sm" type="button" data-act="repnew">${ico('plus',18)}Meinen Abschnitt schreiben</button></div>`)+'</article>';
  }
  return h+'</div>';
}

/* ---------- Ansichten (gemeinsam) ---------- */
function viewTag(){
  const n=S.day,ids=shownIds(),es=dayEntries(n,ids);
  const rows=ids.length>1?`<table class="dtbl" aria-label="Boote an diesem Tag">${ids.map(i=>{const b=boatById(i),st=boatDayStats(i,n);return `<tr><td>${boatBadge(b)}</td><td>${f1(st.sm)} sm · ${st.n} Einträge</td></tr>`;}).join('')}</table>`:'';
  return `${dayChips()}${dayFilter()}
  <div><div class="mono muted small">Tag ${n} · ${dayLabel(n)}${fmtDate(S.trip.from).slice(-4)?' '+fmtDate(S.trip.from).slice(-4):''}</div><h2>${esc(S.trip.name)}</h2></div>
  ${mapBlock(ids,[n],'Karte Tag '+n)}${boatKey(ids)}
  <div class="stats">${statTiles(ids,n)}</div>${rows}
  ${reportsHTML(n)}
  <div class="legend">Einträge</div>${timeline(es,ids.length>1,'Für diesen Tag gibt es noch keine Einträge.')}`;
}
function viewKarte(){
  const days=S.mapDay?[S.mapDay]:Array.from({length:S.today},(_,i)=>i+1);
  const ids=allIds().filter(i=>!S.mapOff[i]);
  const es=ids.flatMap(i=>days.flatMap(d=>dayEntries(d,[i])));
  const sm=ids.reduce((a,i)=>a+days.reduce((x,d)=>x+boatDayStats(i,d).sm,0),0);
  return `<h2>Törnkarte</h2>
  <div class="chips" role="group" aria-label="Tage anzeigen"><button class="chip" type="button" data-act="mapday" data-id="0" aria-pressed="${!S.mapDay}">Alle Tage</button>${Array.from({length:S.today},(_,i)=>i+1).map(n=>`<button class="chip" type="button" data-act="mapday" data-id="${n}" aria-pressed="${S.mapDay===n}">Tag ${n}</button>`).join('')}</div>
  <div class="mapframe">${mapSVG(ids,days,S.mapDay?bbox(es,.82,150):[0,0,420,348],S.sh&&S.sh.id||null,'Törnkarte aller Boote')}</div>
  <div class="muted num">${f1(sm)} sm · ${es.length} Einträge · ${ids.length} von ${S.boats.length} Booten sichtbar</div>
  <div class="card"><div class="legend">Legende</div>
    <ul class="mleg">${S.boats.map(b=>{const on=!S.mapOff[b.id],all=Array.from({length:S.today},(_,i)=>i+1);const sm2=all.reduce((x,d)=>x+boatDayStats(b.id,d).sm,0),n=S.entries.filter(e=>e.boat===b.id).length;
      return `<li><button type="button" data-act="maptog" data-id="${b.id}" aria-pressed="${on}" style="${bcol(b)}" aria-label="${esc(b.name)} ${on?'ausblenden':'einblenden'}">${bsh(b.ci)}<span class="ml-t"><b>${esc(b.name)}</b><span>${esc(b.type)} · ${f1(sm2)} sm · ${n} Einträge</span></span><span class="sw">${on?'sichtbar':'aus'}</span></button></li>`;}).join('')}</ul>
    <p class="muted small">Jedes Boot hat Farbe und Symbolform. Tippe auf einen Eintrag in der Karte, um ihn zu öffnen.</p></div>`;
}

/* Törn-Verwaltung: gemeinsame Teile */
const nameFromEmail=m=>m.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||m;
const validMail=m=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);
function lockCard(txt){return `<div class="lockcard"><div class="row">${ico('lock',22)}<div><b>Anmeldung nötig</b><div class="muted">${txt}</div></div></div><button class="btn sm" type="button" data-act="login">${ico('mail',18)}Mit E-Mail anmelden</button></div>`;}
function accountCard(){
  const me=meP();
  return `<div class="card"><div class="legend">Konto</div>`+(S.signedIn
    ?`<div class="acct"><i class="av">${initials(me.name)}</i><div><b>${esc(me.name)}</b> ${me.admin?'<span class="role">Admin</span>':'<span class="st ok">Mitglied</span>'}<div class="muted small">Cloud-Konto · ${esc(me.email)}</div></div><button class="btn sm" type="button" data-act="logout">Abmelden</button></div>`
    :`<div class="acct"><i class="av">${initials(me.name)}</i><div><b>${esc(me.name)}</b> <span class="role">Admin</span><div class="muted small">Lokaler Modus · Daten nur auf diesem Gerät</div></div></div>${lockCard('Boote anlegen, Personen einladen und das Umsetzen der Crew gehen erst nach der Anmeldung per E-Mail-Code. Einträge schreiben geht auch ohne.')}`)+
  `<div class="muted small"><b>Törn:</b> ${esc(S.trip.name)}${S.trip.from?' · '+fmtDate(S.trip.from)+(S.trip.to?' – '+fmtDate(S.trip.to):''):''}${S.trip.area?' · '+esc(S.trip.area):''}</div></div>`;
}
function asCard(){
  if(!S.signedIn)return '';
  return `<div class="card dim"><div class="legend">Demo · Ansicht als</div><div class="chips" role="group" aria-label="Angemeldete Person wechseln">${S.people.filter(p=>p.status==='angenommen').map(p=>`<button class="chip" type="button" data-act="as" data-id="${p.id}" aria-pressed="${p.id===S.me}"><i class="av sm">${initials(p.name)}</i>${esc(p.name)}${p.admin?' · Admin':''}</button>`).join('')}</div><p class="muted small">Nur Prototyp-Hilfe: Wechselt die angemeldete Person, um die Rechte zu prüfen.</p></div>`;
}
const rulesCard=()=>`<details class="opt"><summary>So funktionieren Rechte &amp; Boote</summary><div class="in"><ul class="rules muted"><li>Wer den Törn anlegt, ist Admin. Boote und Einladungen gibt es erst nach der Anmeldung.</li><li>Eingeladene gelten für den ganzen Törn. Das vorab zugewiesene Boot ist nur ein Vorschlag.</li><li>Alle dürfen auf jedes Boot schreiben, wählen aber vor dem Eintrag ein Boot. Die Wahl bleibt auf dem Gerät.</li><li>Eigene Einträge ändern oder löschen, fremde nur ansehen. Der Admin darf alles.</li></ul></div></details>`;
function inviteCard(){
  return `<div class="card"><div class="legend">Person einladen</div>
  <p class="muted">Die Einladung gilt für den ganzen Törn. Das Boot ist nur ein Vorschlag für den ersten Eintrag, keine Berechtigung.</p>
  <label class="f"><span>E-Mail-Adresse</span><input type="email" inputmode="email" autocomplete="off" id="inv-email" data-bind="S.inv.email" value="${esc(S.inv.email)}" placeholder="name@example.com"></label>
  <fieldset><legend>Boot-Vorschlag (optional)</legend><div class="chips bchips" role="radiogroup" aria-label="Boot-Vorschlag">${boatChipsHTML('invboat',S.inv.boat,true)}</div></fieldset>
  ${S.invErr?`<div class="err">${S.invErr}</div>`:''}
